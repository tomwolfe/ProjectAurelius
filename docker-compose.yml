version: "3.9"

services:
  aurelius-api:
    build:
      context: ./engine
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AURELIUS_API_KEY=${AURELIUS_API_KEY:-}
    volumes:
      - ./engine/data:/app/data
      - engine_cache:/app/cache

volumes:
  engine_cache:
