[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurelius-engine"
version = "10.1.0"
description = "Project Aurelius Discovery Engine - Open-core evolutionary algorithm screening pipeline with hybrid quantum/GC oracle and Gaussian penalty objective."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Thomas Wolfe", email = "tomwolfe@gmail.com"}
]
dependencies = [
    "rdkit>=2023.9.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
cli = [
    "rich>=13.7.0",
]
ml = [
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "scipy>=1.12.0",
]
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "diskcache>=5.6.0",
    "redis>=5.0.0",
]
all = [
    "aurelius-engine[ml,web,dev,cli]",
]
dev = [
    "aurelius-engine[cli,ml]",
    "pytest>=8.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "psutil>=5.9.0",
    "types-psutil",
    "hypothesis>=6.100.0",
]

[project.scripts]
aurelius = "aurelius.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aurelius.data" = ["tier0_seed_smiles.json"]
"aurelius.screening.tier1" = ["*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "N803",
    "N806",
    "N815",
    "N812",
    "E501",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=../engine/src/aurelius --cov-report=term-missing -v"
markers = [
    "slow: marks tests as slow (skipped in fast CI runs)",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false
ignore_missing_imports = true
no_site_packages = true
exclude = "rdkit-stubs"
# Third-party typing limitations: RDKit (attr-defined, no-untyped-call)
# and numpy (no-any-return from incomplete stubs) are suppressed project-wide
disable_error_code = ["attr-defined", "no-untyped-call", "no-any-return", "untyped-decorator"]

[[tool.mypy.overrides]]
module = "rdkit.*"
follow_imports = "skip"
ignore_errors = true
