# Project Aurelius v6.0 — Autonomous Discovery Configuration
#
# This file defines the hyperparameters and paths used by the
# autonomous_screening_agent.py main loop.  It is loaded by
# Hydra at runtime so that the agent is fully reproducible.

# ---------------------------------------------------------------------------
# Screening loop parameters
# ---------------------------------------------------------------------------

max_generations: 50
batch_size: 50
viability_threshold: 65.0
max_wall_time_seconds: 7200  # 2 hours

# ---------------------------------------------------------------------------
# Model paths (relative to project root)
# ---------------------------------------------------------------------------

model_paths:
  tier0: "models/tier0/mpnn_weights.pth"
  tier1: "models/tier1/esol_solubility"

# ---------------------------------------------------------------------------
# Hardware backend selection
#
#   auto   – detect automatically (MPS > CUDA > CPU)
#   mlx    – force MLX backend only
#   cuda   – force PyTorch CUDA backend only
#   cpu    – force CPU-only backend
# ---------------------------------------------------------------------------

hardware_backend: "auto"

# ---------------------------------------------------------------------------
# Mutation engine parameters
# ---------------------------------------------------------------------------

mutation_params:
  mutation_rates:
    brics: 0.4
    fluorinate: 0.3
    unsaturate: 0.3
  diversity_threshold: 0.85       # Tanimoto similarity threshold
  max_history_for_diversity: 5000  # Limit diversity check to last N molecules

# ---------------------------------------------------------------------------
# Parallelism (ProcessPoolExecutor for Tier 1 fingerprinting)
# ---------------------------------------------------------------------------

n_workers: 1  # Set > 1 to enable parallel fingerprinting

# ---------------------------------------------------------------------------
# Checkpointing
# ---------------------------------------------------------------------------

checkpoint:
  path: "agent_state.json"
  save_every_molecule: true  # Save state after every molecule (not just per batch)
