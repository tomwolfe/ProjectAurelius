[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurelius"
version = "9.1.0"
description = "Project Aurelius - Bayesian active-learning screening pipeline with RF/ECFP4 oracle and Gaussian penalty objective."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Thomas Wolfe", email = "tomwolfe@gmail.com"}
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "rdkit>=2023.9.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.8.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
    "structlog>=24.1.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "hypothesis>=6.100.0",
    "types-psutil",
]

[project.scripts]
aurelius = "aurelius.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aurelius.data" = ["tier0_seed_smiles.json", "qm9_subset.csv"]
"aurelius.screening.tier1" = ["*.py"]
"aurelius.cli_scripts" = ["*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "N803",
    "N806",
    "N815",
    "N812",
    "E501",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/aurelius --cov-report=term-missing -v"
markers = [
    "slow: marks tests as slow (skipped in fast CI runs)",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false
ignore_missing_imports = true
# Third-party typing limitations: RDKit (attr-defined, no-untyped-call)
# and numpy (no-any-return from incomplete stubs) are suppressed project-wide
disable_error_code = ["attr-defined", "no-untyped-call", "no-any-return"]

[[tool.mypy.overrides]]
module = "rdkit.*"
ignore_errors = true
