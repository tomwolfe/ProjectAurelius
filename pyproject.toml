[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurelius"
version = "6.0.0"
description = "Project Aurelius v6.0 - The GNN-Enhanced Release. Accelerated computational chemistry screening pipeline with MPNN activation energy prediction, cutoff-aware neighbor lists, and HuggingFace integration, optimized for Apple M-series Neural Accelerators."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Thomas Wolfe", email = "tomwolfe@gmail.com"}
]
dependencies = [
    # Core dependencies available on all platforms
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "pydantic>=2.8.0",
    "tqdm>=4.66.0",
    "hydra-core>=1.3.0",
    "click>=8.1.0",
    "structlog>=24.1.0",
    "psutil>=5.9.0",
    "huggingface-hub>=0.20.0",
    "datasets>=2.16.0",
]

[project.optional-dependencies]
apple = [
    "mlx>=0.15.0",
]
ml = [
    "torch>=2.3.0",
    "torchvision>=0.17.0",
]
chem = [
    "rdkit>=2023.9.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "hypothesis>=6.100.0",
    "types-psutil",
]
full = [
    "aurelius[apple,ml,chem]",
]

[project.scripts]
aurelius = "aurelius.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aurelius.data" = ["force_field_params.json"]
"aurelius.screening.tier1" = ["*.py"]
"aurelius.screening.tier0" = ["*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    # N803: Allow uppercase argument names (X, X_train, X_val) - standard ML math notation
    "N803",
    # N806: Allow uppercase variable names (X, W1, W2, X_mx, etc.) - standard math notation
    "N806",
    # N815: Allow mixedCase in class scope for dataclass fields and config attributes
    "N815",
    # N812: Allow `import torch.nn.functional as F` - standard PyTorch convention
    "N812",
    # E501: Line too long - SMILES strings and f-strings should not be broken
    "E501",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/aurelius --cov-report=term-missing -v"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
