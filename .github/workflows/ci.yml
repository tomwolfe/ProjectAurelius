name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src/aurelius

  test:
    name: Tests
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install huggingface-hub

      - name: Run pytest
        run: pytest tests/ -v

  test-tier1-3:
    name: Tier 1-3 Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install rdkit

      - name: Run tier0 tests
        run: pytest tests/ -v -k "tier1 or tier2 or tier3" --tb=short

  test-memory:
    name: Memory Profiler Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run memory profiler tests
        run: pytest tests/ -v -k "memory or profiler" --tb=short

  wheel:
    name: Build Wheel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Verify wheel contents
        run: |
          ls -la dist/
          python -m zipfile -l dist/*.whl | head -20

  lower-bounds:
    name: Lower Bounds Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies at lower bounds
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  fallback-only:
    name: Fallback-Only Tests (No MLX, No CUDA, No RDKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install base dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install huggingface-hub

      - name: Run aurelius doctor
        run: python -m aurelius doctor --verbose

      - name: Run fallback-safe tests
        run: pytest tests/ -v -k "not (tier1 or tier2 or tier3 or profiler or memory)" --tb=short
