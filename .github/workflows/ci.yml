name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        working-directory: engine
        run: ruff check .

      - name: Run mypy
        working-directory: engine
        run: mypy src/aurelius

  test:
    name: Tests
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install huggingface-hub

      - name: Run heuristic stability test
        working-directory: engine
        run: pytest tests/test_heuristic_stability.py -v --no-header

      - name: Run pytest
        working-directory: engine
        run: pytest tests/ -v

  test-tier1-3:
    name: Tier 1-3 Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install rdkit

      - name: Run tier0 tests
        working-directory: engine
        run: pytest tests/ -v -k "tier1 or tier2 or tier3" --tb=short

  test-memory:
    name: Memory Profiler Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run memory profiler tests
        working-directory: engine
        run: pytest tests/ -v -k "memory or profiler" --tb=short

  wheel:
    name: Build Wheel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        working-directory: engine
        run: |
          pip install build
          python -m build --wheel

      - name: Verify wheel contents
        working-directory: engine
        run: |
          ls -la dist/
          python -m zipfile -l dist/*.whl | head -20

  lower-bounds:
    name: Lower Bounds Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies at lower bounds
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        working-directory: engine
        run: pytest tests/ -v --tb=short

  benchmark-validation:
    name: Benchmark Validation
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Update and Verify Benchmark Documentation
        working-directory: engine
        run: |
          python scripts/update_benchmark_docs.py
          git diff --exit-code docs/benchmarks.md || (echo "ERROR: docs/benchmarks.md is out of date. Run 'python scripts/update_benchmark_docs.py' and commit the changes." && exit 1)

  test-philosophy:
    name: Philosophy Gates (Net Progress & External Validation)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run philosophy gates
        working-directory: engine
        run: pytest tests/test_net_progress.py tests/test_external_validation.py -v

  fallback-only:
    name: Fallback-Only Tests (No MLX, No CUDA, No RDKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install base dependencies only
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install huggingface-hub

      - name: Run aurelius doctor
        working-directory: engine
        run: python -m aurelius doctor --verbose

      - name: Run fallback-safe tests
        working-directory: engine
        run: pytest tests/ -v -k "not (tier1 or tier2 or tier3 or profiler or memory)" --tb=short
