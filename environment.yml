# === Project Aurelius — Conda environment ===
#
# Source of truth for pip dependencies: pyproject.toml (project.dependencies)
# This file only pins conda-only packages (RDKit, Python version).
# Pip dependencies are installed via: pip install -e .
#
# Create environment:
#   conda env create -f environment.yml
#
# Activate:
#   conda activate aurelius
#
# Install package:
#   pip install -e .

name: aurelius
channels:
  - conda-forge

dependencies:
  # Python
  - python=3.11.0

  # Core runtime (conda-forge)
  - click>=8.1.0

  # RDKit (from conda-forge for Apple Silicon compatibility)
  - rdkit=2024.09.6

  # ML stack (optional — pip install -e ".[ml]")
  # numpy, scikit-learn, joblib, scipy installed via pip extras

  # Optional web stack (pip install -e ".[web]")
  # fastapi, uvicorn, diskcache installed via pip extras

  # Development / testing
  - pytest=8.0.0
  - pytest-cov=4.1.0
  - pytest-benchmark=4.0.0
  - ruff=0.3.0
  - mypy=1.9.0
  - hypothesis=6.100.0
  # pip-only packages (not available via conda-forge)
  - pip
  - pip:
    - types-psutil
    - "-e .[ml,dev]"
